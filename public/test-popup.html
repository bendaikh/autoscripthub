<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Popup Test</title>
    <link rel="stylesheet" href="css/sales-popup.css">
</head>
<body>
    <h1 style="text-align: center; padding: 50px;">Sales Popup Test Page</h1>
    <p style="text-align: center;">Wait 3 seconds for the popup to appear...</p>
    
    <!-- jQuery (required) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Sales Popup Script -->
    <script src="js/sales-popup.js"></script>
    
    <!-- Debug -->
    <script>
        console.log('Test page loaded');
        console.log('jQuery version:', $.fn.jquery);
        
        // Check if popup initializes
        setTimeout(function() {
            if ($('#sales-popup-container').length > 0) {
                console.log('✅ Popup container created');
            } else {
                console.log('❌ Popup container NOT created');
            }
        }, 5000);
    </script>
</body>
</html>
