name: Deploy to Hostinger

# Runs on every push/merge to feature/landing-video-qa (the live branch), or manually from the Actions tab.
on:
  push:
    branches: [feature/landing-video-qa]
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in SSHPASS SSH_HOST SSH_USER; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done

      - name: Install sshpass and rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Find the website folder on the server
        # Uses the DEPLOY_PATH secret if set; otherwise looks for the folder
        # under ~/domains/*/public_html that contains this Laravel app.
        run: |
          if [ -z "$DEPLOY_PATH" ]; then
            DEPLOY_PATH="$(sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
              'for d in domains/*/public_html; do [ -f "$d/artisan" ] && [ -f "$d/app/Http/Controllers/CommonController.php" ] && echo "$d"; done')"
            count="$(printf '%s\n' "$DEPLOY_PATH" | grep -c . || true)"
            if [ "$count" != "1" ]; then
              echo "::error::Found $count matching website folders ($DEPLOY_PATH). Add a DEPLOY_PATH secret to choose one."
              exit 1
            fi
          fi
          echo "Deploying to: $DEPLOY_PATH"
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Upload changed files
        # No --delete: files that exist only on the server (.env, vendor,
        # uploads, logs) are never removed. Only files tracked in Git are
        # added or overwritten.
        run: |
          rsync -rlzc --itemize-changes \
            -e "sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='public/storage' \
            --exclude='tests/' \
            --exclude='*.md' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Install dependencies, update database, refresh Laravel caches
        run: |
          # Database updates added since auto-deploy was set up (named
          # 2026_11_14 or later). Laravel skips any that already ran, and
          # older migrations are never touched.
          MIGRATIONS="$(ls database/migrations/*.php | awk -F/ '$NF >= "2026_11_14"' | tr '\n' ' ')"
          echo "Migrations to check: $MIGRATIONS"
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' MIGRATIONS='$MIGRATIONS' bash -s" <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          for m in $MIGRATIONS; do
            echo "Running migration $m"
            php artisan migrate --force --path="$m"
          done
          php artisan optimize:clear
          echo "Deploy finished."
          REMOTE
